<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Scores</title>
  <meta name="description" content="Live football scores, fixtures, results and league tables.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M9 21l5-10 4 7 2-3 3 6"/></svg>
        </span>
        <span class="brand-name" data-brand></span>
      </a>
      <nav class="sports" id="sports"></nav>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Search teams or competitions" autocomplete="off">
      </label>
    </div>
  </header>

  <div class="layout">
    <aside class="side-left" id="sideLeft"></aside>
    <main class="main" id="main"></main>
    <aside class="side-right" id="sideRight"></aside>
  </div>

  <footer class="footer">
    <div class="footer-in">
      <div><strong data-brand></strong> &middot; <span data-tagline></span></div>
      <div class="muted">Scores update automatically every 30 seconds. Data from third-party sports feeds; times shown in your local time zone.</div>
      <div class="muted">&copy; <span id="year"></span> <span data-brand></span> &middot; <a class="flink" href="/terms">Terms</a> &middot; <a class="flink" href="/privacy">Privacy</a></div>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="flags.js"></script>
  <script src="app.js"></script>
</body>
</html>
