<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M9 21l5-10 4 7 2-3 3 6"/></svg></span>
        <span class="brand-name" data-brand></span>
        <span class="admin-tag">Admin</span>
      </a>
      <nav class="adm-nav" id="adminNav" hidden></nav>
      <div class="top-actions" id="topActions" hidden>
        <span class="whoami" id="whoami"></span>
        <a class="btn ghost" href="/" target="_blank" rel="noopener">View site</a>
        <button class="btn ghost" id="logout">Log out</button>
      </div>
    </div>
  </header>

  <main id="app"></main>
  <div class="toast" id="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="flags.js"></script>
  <script src="admin.js"></script>
</body>
</html>
